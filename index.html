<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NFX Motion Portfolio</title>
<meta name="description" content="Motion graphics, video editing, 3D animation and AI films by Yaman (NFX Motion).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#000105;
    --navy:#020b24;
    --gold:#ffc21a;
    --white:#ffffff;
    --soft:rgba(255,255,255,.78);
    --pill:rgba(120,160,225,.28);
    --gap:clamp(14px,3vw,40px);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
    color:var(--white);
    background:var(--black);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  /* ---------- Background: black top, drifting deep-blue glows ---------- */
  .bg{
    position:fixed;inset:0;z-index:-1;overflow:hidden;
    background:linear-gradient(180deg,#000 0%,#000207 22%,var(--navy) 62%,#01040f 100%);
  }
  .bg::before,.bg::after{
    content:"";position:absolute;inset:-25%;
    will-change:transform;
  }
  .bg::before{
    background:
      radial-gradient(38% 30% at 22% 62%, rgba(0,62,200,.78), transparent 70%),
      radial-gradient(30% 26% at 88% 38%, rgba(0,72,210,.55), transparent 70%);
    animation:drift1 38s ease-in-out infinite alternate;
  }
  .bg::after{
    background:
      radial-gradient(34% 24% at 70% 88%, rgba(0,50,175,.6), transparent 70%),
      radial-gradient(22% 18% at 40% 40%, rgba(20,90,230,.25), transparent 70%);
    animation:drift2 46s ease-in-out infinite alternate;
  }
  @keyframes drift1{from{transform:translate(0,0) scale(1)}to{transform:translate(6%,-5%) scale(1.08)}}
  @keyframes drift2{from{transform:translate(0,0) scale(1.05)}to{transform:translate(-7%,4%) scale(.96)}}

  #particles{position:fixed;inset:0;z-index:-1;pointer-events:none;width:100%;height:100%}

  .wrap{width:min(1100px,100% - 2*clamp(16px,5vw,56px));margin-inline:auto}

  /* ---------- Header ---------- */
  .hero{
    padding-top:calc(clamp(32px,6vh,64px) + env(safe-area-inset-top,0px));
    display:flex;flex-direction:column;align-items:center;
    text-align:center;gap:clamp(16px,3vh,28px);
  }
  .welcome{line-height:1.15;font-weight:inherit}
  .welcome span{display:block}
  .welcome .w1{font-weight:300;font-size:clamp(1.5rem,4.5vw,2.6rem)}
  .welcome .w2{
    font-weight:800;font-style:italic;color:var(--gold);
    font-size:clamp(1.6rem,5vw,2.9rem);
    text-shadow:0 0 18px rgba(255,194,26,.55);
  }
  .welcome .w3{font-weight:600;font-size:clamp(1.7rem,5.2vw,3rem)}
  .intro{font-size:clamp(.85rem,1.6vw,1.05rem);line-height:1.7}
  .intro em{color:var(--gold);font-weight:700}

  /* ---------- Video cards ---------- */
  .group{
    display:flex;flex-wrap:wrap;justify-content:center;
    gap:var(--gap);margin-bottom:var(--gap);
  }
  .group[hidden]{display:none}
  .card{
    position:relative;overflow:hidden;display:block;
    border:1px solid rgba(255,255,255,.85);border-radius:8px;
    background:rgba(255,255,255,.05);
    box-shadow:0 0 10px rgba(255,255,255,.28), 0 0 2px rgba(255,255,255,.5);
    color:inherit;text-decoration:none;
    transition:transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s;
  }
  .wide .card{width:calc(50% - var(--gap)/2);max-width:420px;aspect-ratio:16/9}
  .tall .card{width:calc(25% - var(--gap)*3/4);max-width:190px;aspect-ratio:9/16}
  .tall.big .card{width:calc(33.333% - var(--gap)*2/3);max-width:240px}
  .card video{width:100%;height:100%;object-fit:cover;display:block}
  .card .cap{
    position:absolute;left:0;right:0;bottom:0;
    padding:28px 8px 8px;text-align:center;
    font-style:italic;font-weight:600;font-size:clamp(.55rem,1vw,.78rem);
    background:linear-gradient(transparent,rgba(0,0,0,.75));
    pointer-events:none;
  }
  .card .watch{
    position:absolute;inset:0;display:grid;place-items:center;
    background:rgba(0,0,0,.4);
    font-weight:700;font-size:clamp(.7rem,1.2vw,.95rem);
    opacity:0;transition:opacity .3s;pointer-events:none;
  }
  .card .watch span{padding:.55em 1.2em;border:1px solid rgba(255,255,255,.85);border-radius:999px;background:rgba(0,0,0,.35)}
  .card:hover,.card:focus-visible{transform:scale(1.05);box-shadow:0 0 18px rgba(255,255,255,.45), 0 0 3px rgba(255,255,255,.7);z-index:2}
  a.card:hover .watch,a.card:focus-visible .watch{opacity:1}
  .card:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
  .card.spare{display:none}
  .card.empty video{display:none}
  .card.missing::before{
    content:attr(data-missing);position:absolute;inset:0;
    display:grid;place-items:center;padding:10px;text-align:center;
    font-size:.7rem;color:var(--soft);
  }
  .card.soon{border-style:dashed;border-color:rgba(255,255,255,.45);background:rgba(255,255,255,.03);box-shadow:0 0 8px rgba(255,255,255,.12)}
  .card.soon .cap{background:none;color:var(--soft)}

  /* ---------- Selected Works intro ---------- */
  .selected{
    display:flex;align-items:center;justify-content:space-between;gap:24px;
    margin:clamp(20px,4vh,40px) 0 clamp(24px,5vh,48px);
  }
  .selected h2{font-weight:700;font-size:clamp(1.1rem,2.4vw,1.6rem);margin-bottom:.5em}
  .selected p{font-size:clamp(.9rem,1.6vw,1.1rem);line-height:1.5;max-width:26em;color:var(--soft)}
  .avatar-link{
    flex-shrink:0;border-radius:50%;display:block;
    transition:transform .35s cubic-bezier(.2,.8,.2,1);
  }
  .avatar-link:hover{transform:scale(1.06)}
  .avatar-link:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
  .avatar{
    display:block;width:clamp(96px,16vw,150px);aspect-ratio:1;border-radius:50%;object-fit:cover;
    box-shadow:0 0 40px rgba(10,59,156,.7);
  }

  /* ---------- Sections ---------- */
  section{padding:clamp(20px,4vh,40px) 0;text-align:center}
  .pill{
    display:inline-block;
    font-weight:500;font-style:italic;font-size:clamp(.9rem,1.8vw,1.2rem);
    padding:.45em 1.1em;border-radius:999px;
    background:var(--pill);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    margin-bottom:clamp(18px,3vh,32px);
    transition:transform .35s cubic-bezier(.2,.8,.2,1);
    cursor:default;
  }
  .pill:hover{transform:scale(1.08)}

  /* ---------- Footer ---------- */
  footer{
    margin-top:clamp(40px,8vh,80px);
    padding:32px 0 calc(28px + env(safe-area-inset-bottom,0px));
    border-top:1px solid rgba(255,255,255,.15);
    text-align:center;font-size:.85rem;color:var(--soft);
  }
  footer .ig{
    display:inline-block;font-weight:700;font-size:clamp(1.05rem,2vw,1.3rem);
    color:var(--white);text-decoration:none;
    transition:transform .35s cubic-bezier(.2,.8,.2,1), color .3s;
  }
  footer .ig:hover{color:var(--gold);transform:scale(1.06)}
  footer .ig:focus-visible{outline:2px solid var(--gold);outline-offset:4px;border-radius:4px}
  footer .dm{margin-top:.4em;font-size:clamp(.85rem,1.4vw,.95rem)}
  footer .links{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 24px;margin-top:18px}
  footer .links:empty{display:none}
  footer .links a{color:var(--soft);text-decoration:none}
  footer .links a:hover{color:var(--gold)}
  footer .copy{margin-top:22px;font-size:.75rem;opacity:.7}

  /* ---------- Small screens ---------- */
  @media (max-width:480px){
    .wide .card{width:100%}
    .tall .card,.tall.big .card{width:calc(50% - var(--gap)/2)}
    .selected{flex-direction:column-reverse;text-align:center}
  }
  /* Touch screens: no hover, so show the "watch" hint lightly */
  @media (hover:none){
    a.card .watch{opacity:1;background:none;align-items:start;justify-items:end;padding:8px}
    a.card .watch span{font-size:.6rem;padding:.35em .8em}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{transition:none!important;animation:none!important}
  }
</style>
</head>
<body>

<div class="bg" aria-hidden="true"></div>
<canvas id="particles" aria-hidden="true"></canvas>

<div class="wrap">

  <header class="hero">
    <h1 class="welcome">
      <span class="w1">Welcome To</span>
      <span class="w2">NFX Motion</span>
      <span class="w3">Portfolio</span>
    </h1>
    <p class="intro">Hi, I'm Yaman — known as <em>NFX Motion</em>.<br>
      Motion Graphics Designer · Video Editor · 3D Animator · AI Filmmaker.</p>
  </header>

  <div id="featured" style="margin-top:clamp(28px,5vh,48px)"></div>

  <div class="selected">
    <div>
      <h2>Selected Works</h2>
      <p>A curated collection of videos showcasing some of my favorite projects</p>
    </div>
    <a class="avatar-link" id="avatarLink" target="_blank" rel="noopener" aria-label="NFX Motion on Instagram">
      <img class="avatar" src="images/avatar.jpg" alt="Yaman" onerror="this.parentNode.remove()">
    </a>
  </div>

  <div id="sections"></div>

  <footer>
    <div id="igBlock"></div>
    <div class="links" id="contact"></div>
    <div class="copy">© 2026 NFX Motion</div>
  </footer>
</div>

<script src="works.js"></script>
<script>
(function(){
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---- Profile photo link ---- */
  var av = document.getElementById('avatarLink');
  if (av){ if (window.PROFILE_LINK) av.href = PROFILE_LINK; else av.removeAttribute('target'); }

  /* ---- Play videos only while on screen (keeps the site fast) ---- */
  var io = ('IntersectionObserver' in window && !reduce) ? new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      var v = e.target.querySelector('video');
      if (e.isIntersecting){ var p = v.play(); if (p) p.catch(function(){}); } else v.pause();
    });
  }, {threshold:.2}) : null;

  function parse(line){
    var p = line.split('|').map(function(s){ return s.trim(); });
    var o = (p[3]||'').toLowerCase();
    return { file:p[0]||'', title:p[1]||'', link:p[2]||'', force:(o==='wide'||o==='tall') ? o : '' };
  }

  /* Each block has a "tall" row and a "wide" row. A card starts in the row
     its section suggests, then moves to the right row once the real video
     tells us whether it is vertical or horizontal. */
  function refresh(block){
    [block.tall, block.wide].forEach(function(g){
      var visible = Array.prototype.some.call(g.children, function(c){ return !c.classList.contains('spare'); });
      g.hidden = !visible;
    });
  }

  function makeCard(line, kind, block){
    var d = parse(line);
    if (!d.file) return;
    var hasLink = /^https?:\/\//i.test(d.link);
    var el = document.createElement(hasLink ? 'a' : 'div');
    el.className = 'card' + (kind === 'spare' ? ' spare' : '') + (kind === 'soon' ? ' soon empty' : '');
    if (hasLink){
      el.href = d.link; el.target = '_blank'; el.rel = 'noopener';
      el.setAttribute('aria-label', (d.title || 'Video') + ' — watch full video');
    }
    var v = document.createElement('video');
    v.muted = true; v.loop = true; v.playsInline = true;
    v.setAttribute('muted',''); v.setAttribute('playsinline','');
    v.preload = 'metadata';
    el.appendChild(v);
    if (hasLink){
      var w = document.createElement('div'); w.className = 'watch';
      w.innerHTML = '<span>Watch full video</span>'; el.appendChild(w);
    }
    var cap = document.createElement('div'); cap.className = 'cap';
    cap.textContent = kind === 'soon' ? 'Soon' : d.title;
    if (cap.textContent) el.appendChild(cap);

    v.addEventListener('loadedmetadata', function(){
      el.classList.remove('spare','soon','empty','missing');
      if (kind === 'soon'){ if (d.title) cap.textContent = d.title; else cap.remove(); }
      var isWide = d.force ? d.force === 'wide' : v.videoWidth > v.videoHeight * 1.05;
      var target = isWide ? block.wide : block.tall;
      if (el.parentNode !== target) target.appendChild(el);
      refresh(block);
      if (io) io.observe(el);
    });
    v.addEventListener('error', function(){
      if (kind === 'main'){ el.classList.add('missing','empty'); el.dataset.missing = 'Upload videos/' + d.file; }
    });
    v.src = 'videos/' + d.file;
    var startWide = d.force ? d.force === 'wide' : block.layout === 'landscape';
    (startWide ? block.wide : block.tall).appendChild(el);
  }

  function makeBlock(s, parent){
    var block = { layout: s.layout || 'landscape' };
    block.tall = document.createElement('div'); block.tall.className = 'group tall' + (s.big ? ' big' : '');
    block.wide = document.createElement('div'); block.wide.className = 'group wide';
    if (block.layout === 'landscape'){ parent.appendChild(block.wide); parent.appendChild(block.tall); }
    else { parent.appendChild(block.tall); parent.appendChild(block.wide); }
    (s.videos||[]).forEach(function(l){ makeCard(l,'main',block); });
    (s.soon||[]).forEach(function(l){ makeCard(l,'soon',block); });
    (s.spare||[]).forEach(function(l){ makeCard(l,'spare',block); });
    refresh(block);
  }

  if (window.FEATURED) makeBlock(FEATURED, document.getElementById('featured'));

  var holder = document.getElementById('sections');
  (window.SECTIONS||[]).forEach(function(s){
    var sec = document.createElement('section');
    if (s.title){
      var h = document.createElement('h2'); h.className = 'pill'; h.textContent = s.title;
      sec.appendChild(h);
    }
    holder.appendChild(sec);
    makeBlock(s, sec);
  });

  /* ---- Soft white glowing particles ---- */
  (function(){
    var cv = document.getElementById('particles');
    if (!cv || !cv.getContext) return;
    var ctx = cv.getContext('2d'), W = 0, H = 0, dpr = 1, dots = [];
    // one pre-drawn glowing dot, reused for every particle (fast)
    var sprite = document.createElement('canvas'); sprite.width = sprite.height = 32;
    var sc = sprite.getContext('2d'), gr = sc.createRadialGradient(16,16,0,16,16,16);
    gr.addColorStop(0,'rgba(255,255,255,1)');
    gr.addColorStop(.18,'rgba(255,255,255,.9)');
    gr.addColorStop(.45,'rgba(255,255,255,.25)');
    gr.addColorStop(1,'rgba(255,255,255,0)');
    sc.fillStyle = gr; sc.fillRect(0,0,32,32);

    function resize(){
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth; H = window.innerHeight;
      cv.width = W * dpr; cv.height = H * dpr;
      ctx.setTransform(dpr,0,0,dpr,0,0);
      var n = Math.round(Math.min(70, Math.max(28, W * H / 22000)));
      while (dots.length < n) dots.push(newDot(true));
      dots.length = n;
    }
    function newDot(anywhere){
      return {
        x: Math.random() * W,
        y: anywhere ? Math.random() * H : H + 10,
        s: 3 + Math.random() * 7,              // glow size
        vy: 0.08 + Math.random() * 0.22,        // slow upward drift
        amp: 6 + Math.random() * 18,            // side-to-side sway
        ph: Math.random() * Math.PI * 2,
        sp: 0.002 + Math.random() * 0.004,
        a: 0.25 + Math.random() * 0.55,
        tw: Math.random() * Math.PI * 2
      };
    }
    function draw(t){
      ctx.clearRect(0,0,W,H);
      for (var i = 0; i < dots.length; i++){
        var d = dots[i];
        if (!reduce){
          d.y -= d.vy; d.ph += d.sp; d.tw += 0.01;
          if (d.y < -20) dots[i] = d = newDot(false);
        }
        var x = d.x + Math.sin(d.ph) * d.amp;
        ctx.globalAlpha = d.a * (0.7 + 0.3 * Math.sin(d.tw));
        ctx.drawImage(sprite, x - d.s/2, d.y - d.s/2, d.s, d.s);
      }
      if (!reduce) requestAnimationFrame(draw);
    }
    resize();
    window.addEventListener('resize', resize);
    requestAnimationFrame(draw);
  })();

  /* ---- Footer contact (from works.js) ---- */
  var C = window.CONTACT || {}, box = document.getElementById('contact');
  function add(text, href, ext){
    var a = document.createElement('a'); a.textContent = text; a.href = href;
    if (ext){ a.target = '_blank'; a.rel = 'noopener'; }
    box.appendChild(a);
  }
  if (C.phone) add(C.phone, 'tel:' + C.phone.replace(/[^\d+]/g,''));
  if (C.email) add(C.email, 'mailto:' + C.email);
  if (C.instagram){
    var ig = C.instagram.replace(/^@/,'').replace(/^https?:\/\/(www\.)?instagram\.com\//,'').replace(/\/.*$/,'');
    var blk = document.getElementById('igBlock');
    var a = document.createElement('a');
    a.className = 'ig'; a.textContent = '@' + ig;
    a.href = 'https://www.instagram.com/' + ig; a.target = '_blank'; a.rel = 'noopener';
    var dm = document.createElement('p'); dm.className = 'dm';
    dm.textContent = 'For projects and collaborations, send me a DM on Instagram';
    blk.appendChild(a); blk.appendChild(dm);
  }
})();
</script>
</body>
</html>
